# ============================================================
# PORTAL DO NEEM — config.toml
# ============================================================

baseURL          = "https://portaldoneem.com.br/"
languageCode     = "pt-BR"
defaultContentLanguage = "pt-br"
title            = "Portal do Neem"
theme            = ""          # deixar vazio se não usar tema externo
paginate         = 9
enableRobotsTXT  = true
enableGitInfo    = false

# Permalinks
[permalinks]
  blog     = "/blog/:slug/"
  pragas   = "/pragas/:slug/"
  culturas = "/culturas/:slug/"

# Taxonomias
[taxonomies]
  tag      = "tags"
  category = "categorias"
  praga    = "pragas"
  cultura  = "culturas"

# Parâmetros globais
[params]
  description   = "Hub de conhecimento e parcerias sobre óleo de neem. Do pequeno produtor à grande propriedade rural."
  author        = "Portal do Neem"
  og_image      = "/og-image.png"

  # WhatsApp (só números, sem espaços ou traços)
  whatsapp         = "5511999999999"
  whatsapp_display = "(11) 99999-9999"
  whatsapp_msg     = "Olá! Vim pelo Portal do Neem e gostaria de mais informações."

  # Google Analytics — substitua pelo seu ID
  # ga_id = "G-XXXXXXXXXX"

  # Modo em construção: true = mostra tela de espera / false = mostra home completa
  em_construcao = true

  # Formulário de pré-cadastro na tela de construção
  lead_form = true

