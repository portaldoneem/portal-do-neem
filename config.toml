# ── MARKUP ──────────────────────────────────────────────────
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true       # permite HTML dentro do Markdown
  [markup.highlight]
    style          = "monokai"
    lineNos        = false
    codeFences     = true

# ── MINIFICAÇÃO (produção) ───────────────────────────────────
[minify]
  disableCSS  = false
  disableHTML = false
  disableJS   = false
