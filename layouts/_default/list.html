{{ define "main" }}
<section class="list-page">
  <div class="container">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="page-description">{{ . }}</p>{{ end }}
    </header>
    {{ with .Content }}
    <div class="page-content">{{ . }}</div>
    {{ end }}
    <div class="card-grid">
      {{ range .Pages }}
      <a href="{{ .Permalink }}" class="content-card">
        <h3>{{ .Title }}</h3>
        {{ with .Description }}<p>{{ . }}</p>{{ else }}<p>{{ .Summary }}</p>{{ end }}
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
