<header class="site-header">
  <div class="container">
    <a href="/" class="logo">
      <span class="logo-icon">🌿</span>
      <span class="logo-text">Portal do <strong>Neem</strong></span>
    </a>
    <button class="menu-toggle" aria-label="Menu" onclick="document.querySelector('.nav-menu').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-menu">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
