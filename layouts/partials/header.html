<header class="site-header">
  <div class="container">

    <a href="/" class="logo" aria-label="Portal do Neem — página inicial">
      <span class="logo-icon" aria-hidden="true">🌿</span>
      <span class="logo-text">Portal do <strong>Neem</strong></span>
    </a>

    <button
      class="menu-toggle"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="nav-menu"
      onclick="toggleMenu(this)"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="nav-menu" class="nav-menu" aria-label="Menu principal">
      {{ range .Site.Menus.main }}
        {{ if eq .Name "Adquira o Produto" }}
          <a href="{{ .URL }}" class="nav-cta">{{ .Name }}</a>
        {{ else }}
          <a
            href="{{ .URL }}"
            {{ if $.IsMenuCurrent "main" . }}class="active" aria-current="page"{{ end }}
          >{{ .Name }}</a>
        {{ end }}
      {{ end }}
    </nav>

  </div>
</header>

<script>
  function toggleMenu(btn) {
    var nav   = document.getElementById('nav-menu');
    var open  = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
    btn.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
    document.body.style.overflow = open ? 'hidden' : '';
  }
  // Fecha o menu ao clicar em um link (mobile)
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('#nav-menu a').forEach(function (link) {
      link.addEventListener('click', function () {
        var nav = document.getElementById('nav-menu');
        var btn = document.querySelector('.menu-toggle');
        if (nav.classList.contains('open')) {
          nav.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
          btn.setAttribute('aria-label', 'Abrir menu');
          document.body.style.overflow = '';
        }
      });
    });
  });
</script>
