# ============================================================
# PORTAL DO NEEM — hugo.toml (configuração definitiva)
# ============================================================

baseURL      = "https://portaldoneem.com.br/"
languageCode = "pt-BR"
defaultContentLanguage = "pt-br"
title        = "Portal do Neem"
paginate     = 10
enableRobotsTXT = true

# ── PARÂMETROS GLOBAIS ───────────────────────────────────────
[params]
  description      = "Hub de conhecimento e parcerias sobre óleo de neem. Do pequeno produtor à grande propriedade rural."
  author           = "Portal do Neem"
  tagline          = "Cultivando conhecimento. Conectando quem produz a quem precisa."
  email            = "contato@portaldoneem.com.br"
  og_image         = "/og-image.png"

  # WhatsApp — só números, sem espaços ou traços
  whatsapp         = "5511999999999"
  whatsapp_display = "(11) 99999-9999"
  whatsapp_msg     = "Olá! Vim pelo Portal do Neem e gostaria de mais informações."

  # Google Analytics — descomente e substitua pelo seu ID quando ativar
  # ga_id = "G-XXXXXXXXXX"

  # true = mostra tela "Em Construção" / false = mostra home completa
  em_construcao = true

  # true = exibe formulário de pré-cadastro na tela de construção
  lead_form = true

