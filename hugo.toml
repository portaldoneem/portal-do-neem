# ── MARKUP ──────────────────────────────────────────────────
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style      = "monokai"
    lineNos    = false
    codeFences = true

# ── OUTPUTS ─────────────────────────────────────────────────
[outputs]
  home = ["HTML", "RSS"]

# ── SITEMAP ─────────────────────────────────────────────────
[sitemap]
  changeFreq = "weekly"
  priority   = 0.5
  filename   = "sitemap.xml"

# ── TAXONOMIAS ──────────────────────────────────────────────
[taxonomies]
  tag      = "tags"
  category = "categorias"
