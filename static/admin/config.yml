backend:
  name: github
  repo: portaldoneem/portal-do-neem
  branch: main

locale: pt

media_folder: static/images
public_folder: /images

collections:
  - name: pragas
    label: Pragas
    label_singular: Praga
    folder: content/pragas
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Nome da Praga, name: title, widget: string }
      - { label: Descricao SEO, name: description, widget: text }
      - { label: Imagem, name: image, widget: image, required: false }
      - { label: Rotulo da Secao, name: section_label, widget: hidden, default: "Controle por Praga" }
      - { label: CTA WhatsApp, name: cta_whatsapp, widget: boolean, default: true }
      - { label: Conteudo, name: body, widget: markdown }

  - name: culturas
    label: Culturas
    label_singular: Cultura
    folder: content/culturas
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Nome da Cultura, name: title, widget: string }
      - { label: Descricao SEO, name: description, widget: text }
      - { label: Imagem, name: image, widget: image, required: false }
      - { label: Rotulo da Secao, name: section_label, widget: hidden, default: "Controle por Cultura" }
      - { label: CTA WhatsApp, name: cta_whatsapp, widget: boolean, default: true }
      - { label: Conteudo, name: body, widget: markdown }

  - name: parceiros
    label: Produtos de Parceiros
    label_singular: Produto
    folder: content/parceiros
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Nome do Produto, name: title, widget: string }
      - { label: Descricao SEO, name: description, widget: text }
      - { label: Imagem do Produto, name: image, widget: image, required: false }
      - { label: Concentracao Azadiractina, name: concentracao, widget: string }
      - { label: Certificacoes, name: certificacoes, widget: string, required: false }
      - label: Estados Atendidos
        name: estados
        widget: select
        multiple: true
        options:
          - SP
          - MG
          - RJ
          - PR
          - SC
          - RS
          - BA
          - GO
          - MT
          - MS
          - ES
          - PA
          - AM
          - CE
          - PE
          - MA
          - PI
          - TO
          - DF
          - Todos
      - { label: Volume Minimo, name: volume_minimo, widget: string }
      - { label: Prazo Medio de Entrega, name: prazo_entrega, widget: string, required: false }
      - { label: Link Mercado Livre, name: link_ml, widget: string, required: false }
      - { label: Rotulo da Secao, name: section_label, widget: hidden, default: "Produto de Parceiro" }
      - { label: CTA WhatsApp, name: cta_whatsapp, widget: boolean, default: true }
      - { label: Ficha Tecnica, name: body, widget: markdown }

  - name: blog
    label: Blog
    label_singular: Artigo
    folder: content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Titulo, name: title, widget: string }
      - { label: Data de Publicacao, name: date, widget: datetime }
      - { label: Descricao SEO, name: description, widget: text }
      - { label: Imagem de Capa, name: image, widget: image, required: false }
      - { label: Autor, name: author, widget: string, default: Portal do Neem }
      - { label: Rascunho, name: draft, widget: boolean, default: false }
      - { label: Conteudo, name: body, widget: markdown }

  - name: faq
    label: Perguntas Frequentes
    label_singular: Pergunta
    folder: content/faq
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Pergunta, name: title, widget: string }
      - { label: Ordem, name: weight, widget: number, default: 10 }
      - { label: Resposta, name: body, widget: markdown }
